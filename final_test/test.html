<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniEDR Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px; }
        .section {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #e5e7eb;
        }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.malicious { background: #fee2e2; color: #991b1b; }
        .badge.suspicious { background: #fef3c7; color: #92400e; }
        .badge.clean { background: #dcfce7; color: #15803d; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
        }
        .card-title {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
        }
        .card-unit {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }
        table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            color: #4b5563;
        }
        table tr:hover { background: #f9fafb; }
        .timestamp {
            font-size: 12px;
            color: #9ca3af;
            text-align: right;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .alert-row { background: #fef2f2; }
        .alert-row.modified { background: #fffbeb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ MiniEDR Report</h1>
            <p>Endpoint Detection & Response Analysis</p>
        </div>
        <div class="content">
            <!-- Summary Section -->
            <div class="section">
                <h2>📊 Summary</h2>
                <div class="grid">
                    <div class="card">
                        <div class="card-title">Total Alerts</div>
                        <div class="card-value">0</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Malicious</div>
                        <div class="card-value" style="color: #991b1b;">0</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Suspicious</div>
                        <div class="card-value" style="color: #92400e;">0</div>
                    </div>
                </div>
            </div>

            <!-- System Information -->
            
            <div class="section">
                <h2>🖥️ System Information</h2>
                <div class="grid">
                    <div class="card">
                        <div class="card-title">Hostname</div>
                        <div class="card-value" style="font-size: 16px;">fsociety.local</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Platform</div>
                        <div class="card-value" style="font-size: 16px;">Darwin</div>
                    </div>
                    <div class="card">
                        <div class="card-title">CPU Cores</div>
                        <div class="card-value">8</div>
                    </div>
                    <div class="card">
                        <div class="card-title">CPU Usage</div>
                        <div class="card-value">12.0%</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Memory Usage</div>
                        <div class="card-value">78.4%</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Available Memory</div>
                        <div class="card-value" style="font-size: 16px;">1.7 GB</div>
                    </div>
                </div>
            </div>
            

            <!-- FIM Alerts -->
            

            <!-- Footer -->
            <div class="timestamp">
                Generated: 2026-05-07T10:20:31.229376
            </div>
        </div>
    </div>
</body>
</html>
